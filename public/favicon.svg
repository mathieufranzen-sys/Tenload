<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fond" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#122019"/>
      <stop offset="1" stop-color="#04100c"/>
    </linearGradient>
    <linearGradient id="barre" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcf7e8"/>
    </linearGradient>
    <!-- Le fût finit sur le jaune-vert : c'est le dégradé qui fait le talon,
         pas une masse rapportée. Une ellipse plus large que le tracé
         dépasserait forcément du pied de la lettre. -->
    <linearGradient id="fut" x1="0.6" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="0.52" stop-color="#34d399"/>
      <stop offset="1" stop-color="#bef264"/>
    </linearGradient>
    <radialGradient id="lueur" cx="0.3" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#fond)"/>
  <rect width="512" height="512" fill="url(#lueur)"/>

  <!-- Décalé vers le haut et la droite : le fût part à gauche, donc le centre
       géométrique de la lettre n'est pas son centre optique. -->
  <g transform="translate(14, -10)">
    <rect x="110" y="152" width="276" height="48" rx="24" fill="url(#barre)"/>
    <path d="M 248 200 L 248 286 C 248 348 232 372 206 396"
          fill="none" stroke="url(#fut)" stroke-width="48" stroke-linecap="round"/>
  </g>
</svg>
