<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tendo — Marathon de Paris 2027</title>
<style>
:root{
  --bg:#08090B; --surface:#171A20; --surface-2:#1F232B; --surface-3:#282D37;
  --ink:#FFFFFF; --ink-2:#8F949E; --ink-3:#666B75;
  --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.12);
  --radius:18px; --radius-sm:12px;
  /* dataviz — palette validée (dark, surface #1A1D23) */
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;
  --grid:#23262C; --axis:#33373F; --muted:#898781;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{font-size:16px;line-height:1.45}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ---------------- shell ---------------- */
#shell{max-width:520px;margin:0 auto;min-height:100vh;position:relative;
  background:var(--bg);display:flex;flex-direction:column}
@media(min-width:560px){
  #shell{box-shadow:0 0 0 1px var(--border),0 40px 120px rgba(0,0,0,.7);
    min-height:100vh;border-radius:0}
  body{background:#000}
}
main{flex:1;padding:0 18px 108px;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--bg) 68%,rgba(8,9,11,0));
  padding:22px 18px 14px;margin:0 -18px 4px}
.topbar h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.6px}
.topbar .sub{color:var(--ink-2);font-size:14.5px;margin-top:3px;font-weight:500}

/* ---------------- bottom nav ---------------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:center;
  background:rgba(15,17,21,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom)}
nav .inner{display:flex;width:100%;max-width:520px}
nav button{flex:1;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);font-size:10.5px;font-weight:600;letter-spacing:-.1px;transition:color .15s}
nav button svg{width:23px;height:23px;stroke-width:1.9}
nav button[aria-current="page"]{color:var(--ink)}

/* ---------------- cards ---------------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 17px;margin-bottom:12px}
.card.tight{padding:14px 15px}
.sess{position:relative;display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px 16px 26px;
  margin-bottom:11px;overflow:hidden;transition:transform .12s,background .15s}
.sess:active{transform:scale(.985);background:var(--surface-2)}
.sess::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--g)}
.sess h3{margin:0 0 3px;font-size:20.5px;font-weight:800;letter-spacing:-.45px;line-height:1.2}
.sess.done h3{padding-right:32px}
.sess .meta{color:var(--ink-2);font-size:14px;font-weight:500}
.sess .cat{color:var(--ink);font-size:14.5px;font-weight:500;margin-top:9px}
.sess.done{opacity:.55}
.sess .tick{position:absolute;right:15px;top:15px;width:22px;height:22px;border-radius:50%;
  background:var(--good);display:grid;place-items:center}
.sess .tick svg{width:13px;height:13px;stroke:#fff;stroke-width:3}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3.5px 9px;border-radius:100px;background:var(--surface-3);color:var(--ink);
  letter-spacing:.1px;vertical-align:middle;line-height:1.35;text-align:left}
.badge svg{width:12.5px;height:12.5px;flex:none;stroke-width:2.4}
.badge.warn{background:rgba(250,178,25,.16);color:#FFD166}
.badge.crit{background:rgba(208,59,59,.18);color:#FF8A8A}
.badge.ok{background:rgba(12,163,12,.16);color:#5BE05B}
.dot{width:11px;height:11px;border-radius:50%;background:var(--g);display:inline-block;
  vertical-align:-1px;margin-right:7px}

/* ---------------- hero ---------------- */
.hero{position:relative;border-radius:22px;padding:20px;margin-bottom:13px;overflow:hidden;
  border:1px solid var(--border-2)}
.hero::before{content:"";position:absolute;inset:0;background:var(--g);opacity:.22}
.hero::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 15% 0%,rgba(255,255,255,.14),transparent 60%)}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:11.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  color:rgba(255,255,255,.72)}
.hero h2{margin:6px 0 4px;font-size:26px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
.hero .m{color:rgba(255,255,255,.8);font-size:14.5px;font-weight:500}
.hero .row{display:flex;gap:22px;margin-top:16px}
.hero .row b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px}
.hero .row span{font-size:12.5px;color:rgba(255,255,255,.7);font-weight:600}

/* ---------------- buttons ---------------- */
.btn{display:block;width:100%;padding:15px;border-radius:100px;font-weight:700;font-size:16px;
  text-align:center;letter-spacing:-.2px;transition:opacity .15s,transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:#F2F2F4;color:#0B0C0E}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--border-2)}
.btn.dim{background:transparent;color:var(--ink-2);border:1px solid var(--border-2)}
.btn:disabled{opacity:.4}

.seg{display:flex;background:var(--surface-2);border-radius:100px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 4px;border-radius:100px;font-size:14px;font-weight:700;
  color:var(--ink-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:#0C0D10;color:var(--ink)}

/* ---------------- week nav ---------------- */
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 4px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.wknav button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.wknav button:active{background:var(--surface-2)}
.wknav .lbl{text-align:center;flex:1}
.wknav .lbl b{display:block;font-size:17.5px;font-weight:800;letter-spacing:-.4px}
.wknav .lbl span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.daylbl{font-size:12px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--ink-3);margin:18px 0 9px 2px}

/* ---------------- sheet (détail séance) ---------------- */
#sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-width:520px;margin:0 auto}
#sheet.open{transform:translateY(0)}
#sheet .glow{position:absolute;top:0;left:0;right:0;height:230px;background:var(--g);
  opacity:.3;filter:blur(46px);pointer-events:none}
#sheet .body{position:relative;padding:14px 18px 130px}
.close{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.08);margin-bottom:18px}
#sheet h2{margin:0 0 7px;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.12}
#sheet .kv{display:flex;gap:34px;margin:20px 0}
#sheet .kv div span{display:block;color:var(--ink-2);font-size:13.5px;font-weight:500}
#sheet .kv div b{font-size:22px;font-weight:800;letter-spacing:-.5px}
.hr{height:1px;background:var(--border);margin:20px 0}
.dash{height:1px;background:repeating-linear-gradient(90deg,var(--border-2) 0 4px,transparent 4px 9px);
  margin:18px 0}
.secth{display:flex;align-items:center;gap:10px;font-size:17.5px;font-weight:800;
  letter-spacing:-.35px;margin:20px 0 12px}
.secth svg{width:21px;height:21px;stroke-width:2;color:var(--ink)}
.step{position:relative;padding-left:18px;margin-bottom:14px}
.step::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4.5px;border-radius:3px;
  background:var(--sg,var(--ink-3))}
.step b{display:block;font-size:16px;font-weight:700;letter-spacing:-.2px}
.step span{display:block;color:var(--ink-2);font-size:14.5px;font-weight:500;margin-top:1px}
.ex{display:flex;justify-content:space-between;gap:14px;padding:12px 0;
  border-bottom:1px solid var(--border)}
.ex:last-child{border-bottom:0}
.ex .n{font-size:15.5px;font-weight:600;letter-spacing:-.15px}
.ex .n em{display:block;font-style:normal;color:var(--ink-3);font-size:13px;font-weight:500;margin-top:2px}
.ex .s{font-size:15.5px;font-weight:800;white-space:nowrap;color:var(--ink)}
.coach{display:flex;gap:12px;align-items:center;margin:22px 0 12px}
.coach .av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#D97757,#C15F3C);font-weight:800;font-size:16px;color:#fff}
.coach b{display:block;font-size:16px;font-weight:700}
.coach span{color:var(--ink-2);font-size:13.5px;font-weight:500}
.cnote{color:#D6D9DE;font-size:15.5px;line-height:1.55}
.sticky{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;padding:14px 18px
  calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(8,9,11,0),var(--bg) 34%);
  z-index:5}

/* ---------------- sliders ---------------- */
.sl{margin:20px 0 4px}
.sl .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.sl .top b{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.sl .val{font-size:29px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.sl .hint{color:var(--ink-2);font-size:13px;font-weight:500;margin-top:9px;min-height:34px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:100px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:#fff;margin-top:-10px;box-shadow:0 2px 10px rgba(0,0,0,.5);border:0}
input[type=range]::-moz-range-track{height:8px;border-radius:100px;background:var(--track)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;
  box-shadow:0 2px 10px rgba(0,0,0,.5)}
.ticks{display:flex;justify-content:space-between;color:var(--ink-3);font-size:11px;
  font-weight:600;margin-top:-2px;font-variant-numeric:tabular-nums}
textarea{width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:14px;
  padding:13px;min-height:82px;resize:vertical;font-size:15px;line-height:1.45;outline:none}
textarea:focus{border-color:var(--border-2);box-shadow:0 0 0 3px rgba(255,255,255,.05)}
input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--border-2);
  border-radius:14px;padding:14px;font-size:19px;font-weight:700;outline:none;
  font-variant-numeric:tabular-nums;letter-spacing:-.3px}

/* ---------------- alerts ---------------- */
.alert{border-radius:var(--radius);padding:15px 16px;margin-bottom:13px;border:1px solid}
.alert h4{margin:0 0 6px;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;
  letter-spacing:-.2px}
.alert h4 svg{width:18px;height:18px;flex:none;stroke-width:2.3}
.alert p{margin:0;font-size:14.5px;line-height:1.5;color:#D6D9DE}
.alert ul{margin:9px 0 0;padding-left:19px;font-size:14.5px;line-height:1.6;color:#D6D9DE}
.alert.l0{background:rgba(12,163,12,.09);border-color:rgba(12,163,12,.32)}
.alert.l0 h4{color:#5BE05B}
.alert.l1{background:rgba(250,178,25,.09);border-color:rgba(250,178,25,.32)}
.alert.l1 h4{color:#FFD166}
.alert.l2{background:rgba(236,131,90,.1);border-color:rgba(236,131,90,.35)}
.alert.l2 h4{color:#FFA579}
.alert.l3{background:rgba(208,59,59,.12);border-color:rgba(208,59,59,.4)}
.alert.l3 h4{color:#FF8A8A}
.alert.info{background:var(--surface);border-color:var(--border-2)}
.alert.info h4{color:var(--ink)}

/* ---------------- kpi / dataviz ---------------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px}
.kpi .l{color:var(--ink-2);font-size:12.5px;font-weight:600;letter-spacing:-.1px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.9px;margin-top:3px;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.kpi .d{font-size:12px;font-weight:700;margin-top:3px}
.viz{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 14px 12px;margin-bottom:13px}
.viz h4{margin:0 2px 3px;font-size:16px;font-weight:800;letter-spacing:-.3px}
.viz .cap{margin:0 2px 14px;color:var(--ink-2);font-size:13px;font-weight:500;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin:12px 2px 2px}
.legend i{display:flex;align-items:center;gap:6px;font-style:normal;font-size:12.5px;
  font-weight:600;color:var(--ink-2)}
.legend i b{width:11px;height:3px;border-radius:2px;flex:none}
svg.chart{display:block;width:100%;overflow:visible;touch-action:pan-y}
svg.chart text{font-family:var(--font);font-size:10.5px;fill:var(--muted);font-weight:600}
.tip{position:absolute;pointer-events:none;background:#0C0E12;border:1px solid var(--border-2);
  border-radius:11px;padding:9px 11px;font-size:12.5px;line-height:1.5;opacity:0;
  transition:opacity .1s;z-index:10;box-shadow:0 8px 28px rgba(0,0,0,.6);min-width:126px}
.tip.on{opacity:1}
.tip .t{font-weight:800;font-size:12.5px;margin-bottom:5px;letter-spacing:-.1px}
.tip .r{display:flex;align-items:center;gap:7px;color:var(--ink-2);white-space:nowrap}
.tip .r b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.tip .r i{width:9px;height:9px;border-radius:2px;flex:none}
.meter{margin-bottom:14px}
.meter .top{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:7px}
.meter .top b{font-weight:800;font-variant-numeric:tabular-nums}
.meter .track{height:8px;border-radius:100px;background:var(--surface-3);overflow:hidden}
.meter .fill{height:100%;border-radius:100px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--ink-2);font-weight:700;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.7px;padding:0 8px 9px 0;border-bottom:1px solid var(--border-2)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
td:first-child{font-weight:600;font-variant-numeric:normal}
.disc{display:block;width:100%;text-align:left;color:var(--ink-2);font-size:13.5px;font-weight:600;
  padding:11px 0}
.zrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.zrow:last-child{border-bottom:0}
.zrow .bar{width:4.5px;height:34px;border-radius:3px;flex:none}
.zrow .n{flex:1}
.zrow .n b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.zrow .n span{color:var(--ink-2);font-size:13px;font-weight:500}
.zrow .p{font-size:19px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.zrow .p em{font-style:normal;font-size:12.5px;color:var(--ink-2);font-weight:600}
.blocpill{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;padding:5px 11px;border-radius:100px;margin-bottom:11px}
.empty{text-align:center;padding:38px 20px;color:var(--ink-3)}
.empty svg{width:38px;height:38px;stroke-width:1.6;margin-bottom:12px;opacity:.6}
.empty p{margin:0;font-size:14.5px;line-height:1.5;font-weight:500}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,26px);z-index:80;
  background:#F2F2F4;color:#0B0C0E;padding:13px 20px;border-radius:100px;font-weight:700;
  font-size:14.5px;opacity:0;transition:all .28s cubic-bezier(.32,.72,0,1);
  box-shadow:0 10px 34px rgba(0,0,0,.55);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.pretitle{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--ink-3);margin:26px 0 10px 2px}
.link{color:#7FB3FF;text-decoration:none;font-weight:600;border-bottom:1px solid rgba(127,179,255,.3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-palette="#3987e5,#d95926,#199e70">
<div id="shell">
  <main id="view"></main>
  <nav><div class="inner" id="nav"></div></nav>
</div>
<div id="sheet"><div class="glow"></div><div class="body" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

/** Durée estimée d'une séance de course, à partir des allures courantes. */
function estDur(s){
  if(s.dur) return s.dur;
  if(s.type==='race'&&s.dist){            // le marathon : allure cible, pas d'ajout d'échauffement
    const t=s.dist*zPace('am')/60;
    return [Math.round(t*.99/5)*5,Math.round(t*1.05/5)*5];
  }
  let sec=0;
  if(s.struct) s.struct.forEach(x=>{ sec += x.km*zPace(x.zone); });
  else{
    const seg = [...(s.wu||[]),...(s.main||[]),...(s.cd||[])];
    let reps=1;
    seg.forEach(([a,b])=>{
      const m=String(a).match(/^(\d+)\s*x\s*([\d,.]+)\s*(km|m)?/i);
      if(m){
        const n=+m[1], q=parseFloat(m[2].replace(',','.'));
        const km = (m[3]==='m') ? q/1000 : q;
        sec += n*km*(PLAN.zones[b]?zPace(b):zPace('vo2')) + n*90;
      }else if(typeof a==='number'){ sec += a*zPace(b||'ef'); }
      else{
        const km=String(a).match(/([\d,.]+)\s*km/); const mn=String(a).match(/(\d+)\s*min/);
        const mm=String(a).match(/([\d,.]+)\s*m\b/);
        if(km) sec += parseFloat(km[1].replace(',','.'))*(PLAN.zones[b]?zPace(b):zPace('ef'));
        else if(mn) sec += +mn[1]*60;
        else if(mm) sec += parseFloat(mm[1].replace(',','.'))/1000*zPace(b||'vo2');
        else sec += 180;
      }
    });
  }
  const m = sec/60;
  return [Math.round(m/5)*5, Math.round((m*1.08)/5)*5];
}
function durTxt(s){
  const d=estDur(s);
  return d[0]===d[1] ? dur(d[0]) : `${dur(d[0])} - ${dur(d[1])}`;
}

/* ============================================================ indice de charge du tendon
 * 0 à 100. Combine la charge mécanique réellement encaissée, le rapport entre charge
 * récente et charge de fond, la douleur déclarée, sa tendance, la monotonie de la
 * semaine, et les gestes qui protègent (excentrique, repos, glaçage).
 * Calibré sur les données réelles de Mathieu : mai à août 2026.
 */
const KM_COST={recup:.9,ef:1,long:1.15,am:1.35,seuil:1.6,vo2:2.1,rep:2.1};
const MIN_COST={velo:.10,'muscu-bas':.25,escalade:.06,'muscu-haut':0,hike:.05,repos:0};
const RUN_COST={long:1.15,ef:1,recup:.95,tempo:1.27,inter:1.50,test:1.50,course:1.35,race:1.35};

function stravaKind(a){
  const n=(a.name||'').toLowerCase();
  if(a.sport==='Ride')   return ['velo',null];
  if(a.sport==='Weight') return [/jambe|bas|bulgare|trx/.test(n)?'muscu-bas':'muscu-haut',null];
  if(a.sport==='Hike')   return ['hike',null];
  if(a.sport==='Soccer') return ['escalade',null];
  if(/fractionn|x800|x400|x200|test/.test(n)) return ['run','vo2'];
  if(/seuil|tempo/.test(n))                   return ['run','seuil'];
  return ['run', a.km>=18?'long':'ef'];
}
function sessLoad(s){
  if(s.struct) return s.struct.reduce((a,x)=>a+x.km*(KM_COST[x.zone]||1),0);
  if(s.dist)   return s.dist*(RUN_COST[s.type]||1);
  const m=s.dur?s.dur[0]:0;
  return m*(MIN_COST[s.type]??0);
}
/** Charge tendineuse par jour : Strava pour le passé, le plan pour le prévisionnel. */
function buildLoad(){
  const L={}, now=iso(TODAY), seen=new Set();
  STRAVA.forEach(a=>{
    const [k,z]=stravaKind(a);
    let v = k==='run'
      ? a.km*((z==='vo2'||z==='seuil') ? .45*KM_COST[z]+.55*KM_COST.ef : KM_COST[z])
      : a.min*(MIN_COST[k]??0);
    L[a.date]=(L[a.date]||0)+v; seen.add(a.date);
  });
  PLAN.weeks.forEach(w=>w.sessions.forEach(s=>{
    const d=sessDate(w,s.day);
    if(d<=now && seen.has(d)) return;         // Strava fait foi sur le passé
    if(d<=now && !S.fb[fbKey(w.n,s.day,w.sessions.indexOf(s))]) return; // non fait, non compté
    L[d]=(L[d]||0)+sessLoad(s);
  }));
  return L;
}
/** Trois mesures de douleur par jour : carnet Notion + saisies de l'app. */
function buildPain(){
  const P={};
  NOTION.forEach(r=>{ P[r.date]={w:r.painWake,e:r.painEffort,v:r.painEvening,
    ecc:(r.activities||[]).includes('Renfo Bas'),ice:r.icing,jump:r.jumps}; });
  Object.entries(S.morning).forEach(([d,v])=>{ P[d]=P[d]||{}; P[d].w=v; });
  Object.entries(S.evening).forEach(([d,v])=>{ P[d]=P[d]||{}; P[d].v=v; });
  Object.values(S.fb).forEach(f=>{ if(!f.date) return; P[f.date]=P[f.date]||{};
    P[f.date].e=Math.max(P[f.date].e??0,f.pain);
    if(f.type==='muscu-bas') P[f.date].ecc=true; });
  return P;
}

function ewma(L,d,hl){
  const lam=1-Math.exp(-Math.LN2/hl);
  let v=0;
  for(let k=59;k>=0;k--) v=v+lam*((L[dayOf(d,k)]||0)-v);
  return v;
}

  const td=P[d], y=P[dayOf(d,1)];
  const vals=[],ws=[];
  if(td&&td.w!=null){vals.push(td.w);ws.push(.45);}      // raideur matinale
  if(y&&y.v!=null){vals.push(y.v);ws.push(.35);}         // réaction retardée à hier
  if(y&&y.e!=null){vals.push(y.e);ws.push(.20);}         // ressenti pendant l'effort
  if(!vals.length){
    for(let k=1;k<5;k++){ const r=P[dayOf(d,k)]; if(!r) continue;
      const m=[r.w,r.e,r.v].filter(x=>x!=null);
      if(m.length) return {s:Math.max(...m)*Math.max(0,1-k/4),stale:true}; }
    return {s:null};
  }
  const wsum=ws.reduce((a,b)=>a+b,0);
  const weighted=vals.reduce((a,v,i)=>a+v*ws[i],0)/wsum;
  let peak=0;
  for(let k=0;k<3;k++){ const r=P[dayOf(d,k)]; if(!r) continue;
    [r.w,r.e,r.v].forEach(x=>{ if(x!=null) peak=Math.max(peak,x); }); }
  return {s:.55*weighted+.45*peak};
}
function painTrend(d,P){
  const vs=[];
  for(let k=3;k>=0;k--){ const r=P[dayOf(d,k)]; if(r&&r.w!=null) vs.push(r.w); }
  if(vs.length<3) return 0;
  const n=vs.length, mx=(n-1)/2, mu=vs.reduce((a,b)=>a+b,0)/n;
  let num=0,den=0;
  vs.forEach((v,i)=>{ num+=(i-mx)*(v-mu); den+=(i-mx)**2; });
  return den?Math.max(0,num/den):0;
}
function tendonIndex(d,L,P,memo){
  const A=ewma(L,d,3.5), C=ewma(L,d,14);
  const R=C>.5?A/C:1;
  const m1=30*clamp((R-.9)/.7,0,1);
  const recent=(L[dayOf(d,1)]||0)+.55*(L[dayOf(d,2)]||0);
  const m2=C>.5?20*clamp(recent/(2.6*C),0,1):0;
  const ps=painScore(d,P);
  const p=ps.s!=null?85*Math.pow(clamp(ps.s,0,10)/10,1.15):0;
  const tr=6*clamp(painTrend(d,P)/1.5,0,1);
  const w=[];for(let k=0;k<7;k++) w.push(L[dayOf(d,k)]||0);
  const mu=w.reduce((a,b)=>a+b,0)/7;
  const sd=Math.sqrt(w.reduce((a,x)=>a+(x-mu)**2,0)/7);
  const mo=sd>.3?8*clamp((mu/sd-1.3)/1.2,0,1):0;
  let cr=0; const y=P[dayOf(d,1)];
  if(y&&y.ecc)  cr+=6;                       // excentrique de la veille : thérapeutique
  if(y&&y.jump) cr+=2;
  if(y&&y.ice)  cr+=2;
  if((L[dayOf(d,1)]||0)<2) cr+=5;            // vraie journée de repos
  let idx=m1+m2+p+tr+mo-cr;
  // planchers : les seuils posés par Mathieu ne peuvent pas être contournés
  let floor=0;
  for(let k=0;k<2;k++){ const r=P[dayOf(d,k)]; if(!r) continue;
    const m=Math.max(...[r.w,r.e,r.v].filter(x=>x!=null).concat([0]));
    const dec=k?0.92:1;
    if(m>=8) floor=Math.max(floor,80*dec);
    else if(m>=6) floor=Math.max(floor,65*dec);
    else if(m>=4) floor=Math.max(floor,50*dec);
  }
  // mémoire d'épisode : un tendon réactif reste fragile plusieurs jours
  if(memo) for(let k=1;k<6;k++){ const pv=memo[dayOf(d,k)];
    if(pv!=null&&pv>=60) floor=Math.max(floor,pv*Math.pow(.74,k)); }
  idx=Math.max(idx,floor);
  return {idx:clamp(Math.round(idx),0,100),m1:Math.round(m1),m2:Math.round(m2),
          p:Math.round(p),tr:Math.round(tr),mo:Math.round(mo),cr:Math.round(cr),
          A:Math.round(A*10)/10,C:Math.round(C*10)/10,R:Math.round(R*100)/100,
          pain:ps.s==null?null:Math.round(ps.s*10)/10,stale:!!ps.stale};
}
/** Série de l'indice sur une fenêtre, avec la mémoire d'épisode chaînée. */
let _IDX=null;
function indexSeries(){
  if(_IDX) return _IDX;
  const L=buildLoad(), P=buildPain();
  const start='2026-06-01', end=addD(iso(TODAY),21);
  const memo={}, out=[];
  let d=start;
  while(d<=end){ const r=tendonIndex(d,L,P,memo); memo[d]=r.idx;
    out.push({d,...r,load:Math.round((L[d]||0)*10)/10}); d=addD(d,1); }
  _IDX={rows:out,byDate:Object.fromEntries(out.map(r=>[r.d,r])),L,P};
  return _IDX;
}
const BANDS=[
  {max:29,k:'vert',  n:'Vert',   c:'#0ca30c', t:'Tout est autorisé',
   d:'Le tendon encaisse. Si tu restes sous 15 trois jours de suite, tu peux même ajouter du volume.'},
  {max:49,k:'jaune', n:'Jaune',  c:'#fab219', t:'Plan nominal',
   d:'Charge normale d’un entraînement qui progresse. Rien à changer, mais garde un œil sur la douleur du soir.'},
  {max:64,k:'orange',n:'Orange', c:'#ec835a', t:'Ni vitesse ni muscu lourde',
   d:'Pas de séance de qualité aujourd’hui, pas de renfo bas du corps chargé. Sortie longue raccourcie de 20 %. Endurance facile et vélo restent ouverts.'},
  {max:79,k:'rouge', n:'Rouge',  c:'#d03b3b', t:'Aucune course',
   d:'Vélo en Z2 et haut du corps uniquement. Le tendon est en réaction, courir dessus prolonge l’épisode de plusieurs semaines.'},
  {max:100,k:'noir', n:'Noir',   c:'#8B1A1A',t:'Repos complet des jambes',
   d:'Zéro charge. Mobilité douce, glaçage. Si tu restes ici trois jours, tu prends rendez-vous chez ton kiné.'},
];
const bandOf=i=>BANDS.find(b=>i<=b.max);

/* ============================================================ moteur d'adaptation */
/**
 * Règles décidées avec Mathieu :
 *  R1 douleur séance 4-5  -> sortie longue suivante en plateau, qualité -> vélo Z3
 *  R2 douleur séance 6-7  -> SL -25%, qualité annulée, mardi EF -> vélo, excentrique quotidien
 *  R3 douleur séance >=8  -> arrêt course 5 jours, vélo Z2 + haut du corps, kiné
 *  R4 douleur réveil >3 sur 3 jours -> traitement R2
 *  R5 RPE>=9 sur 2 qualités d'affilée sans douleur -> allures trop rapides, +5 s/km
 *  R6 3 semaines à douleur max <=2 -> feu vert, progression normale
 */
function adapt(){
  const now=iso(TODAY);
  const IX=indexSeries();
  const today=IX.byDate[now]||{idx:0};
  const band=bandOf(today.idx);
  const rules=[];
  const fx={slPlateau:false,slCut:0,qualityToBike:false,cancelQuality:false,
            tuesdayToBike:false,runStop:false,legStop:false,dailyEcc:false,lightLegs:false};
  const level={vert:0,jaune:0,orange:1,rouge:2,noir:3}[band.k];

  if(band.k==='orange'){
    rules.push({id:'IDX',t:`Indice de charge du tendon à ${today.idx} sur 100`,
      a:'Séance de qualité remplacée par du vélo Z3, renfo bas du corps allégé, sortie longue raccourcie de 20 %.'});
    Object.assign(fx,{slCut:.2,qualityToBike:true,lightLegs:true});
  } else if(band.k==='rouge'){
    rules.push({id:'IDX',t:`Indice de charge du tendon à ${today.idx} sur 100`,
      a:'Aucune course. Vélo Z2 et haut du corps uniquement, protocole excentrique quotidien à charge légère.'});
    Object.assign(fx,{runStop:true,cancelQuality:true,tuesdayToBike:true,dailyEcc:true,lightLegs:true});
  } else if(band.k==='noir'){
    rules.push({id:'IDX',t:`Indice de charge du tendon à ${today.idx} sur 100`,
      a:'Repos complet des jambes. Mobilité et glaçage seulement. Trois jours dans cette zone et tu appelles ton kiné.'});
    Object.assign(fx,{runStop:true,legStop:true,cancelQuality:true,tuesdayToBike:true,dailyEcc:true});
  }

  // ce qui pousse l'indice : on l'explique, ça évite l'effet boîte noire
  if(level>0){
    const parts=[];
    if(today.p>=20) parts.push(`la douleur déclarée (${today.p} points)`);
    if(today.m1>=12) parts.push(`l’emballement de la charge récente (ratio ${today.R})`);
    if(today.m2>=12) parts.push('le manque de fraîcheur des 48 dernières heures');
    if(today.tr>=3) parts.push('la raideur matinale qui monte depuis plusieurs jours');
    if(today.mo>=4) parts.push('une semaine trop monotone, sans jour vraiment léger');
    if(parts.length) rules.push({id:'POURQUOI',t:'Ce qui pèse le plus',
      a:parts.join(', ')+'.'});
  }

  const entries=Object.entries(S.fb).map(([k,v])=>({k,...v})).filter(v=>v.date)
    .sort((a,b)=>a.date<b.date?1:-1);
  // allures trop rapides
  const qual=entries.filter(v=>v.kind==='q').slice(0,2);
  if(qual.length===2 && qual.every(v=>v.rpe>=9 && v.pain<4))
    rules.push({id:'ALLURES',t:'Deux séances de qualité à 9/10 d’effort ou plus, sans douleur',
      a:'Les allures cibles sont trop rapides pour l’instant : ajoute 5 s/km sur toutes les zones dans l’onglet Allures.'});
  // feu vert
  const last14=IX.rows.filter(r=>r.d<=now&&r.d>addD(now,-14));
  if(band.k==='vert' && last14.length>=10 && Math.max(...last14.map(r=>r.idx))<=25)
    rules.push({id:'FEUVERT',t:'Deux semaines sous 25 sans à-coup',
      a:'Le tendon a tourné la page. Tu peux transformer un vélo en course facile, ou pousser la sortie longue de 2 km de plus que prévu.'});

  return {level,band,idx:today.idx,detail:today,rules,fx,
          n:entries.length,stale:today.stale};
}
/** Effets applicables à une date donnée, d'après l'indice projeté de CE jour.
 *  Au-delà de 10 jours, le plan reste nominal : projeter plus loin n'aurait pas de sens. */
function fxForDate(d){
  const now=iso(TODAY);
  const none={slCut:0,qualityToBike:false,cancelQuality:false,tuesdayToBike:false,
              runStop:false,legStop:false,lightLegs:false,idx:null,band:null};
  if(d<now || d>addD(now,10)) return none;
  const r=indexSeries().byDate[d];
  if(!r) return none;
  const b=bandOf(r.idx);
  if(b.k==='orange') return {...none,slCut:.2,qualityToBike:true,lightLegs:true,idx:r.idx,band:b};
  if(b.k==='rouge')  return {...none,runStop:true,cancelQuality:true,tuesdayToBike:true,
                             lightLegs:true,idx:r.idx,band:b};
  if(b.k==='noir')   return {...none,runStop:true,legStop:true,cancelQuality:true,
                             tuesdayToBike:true,idx:r.idx,band:b};
  return {...none,idx:r.idx,band:b};
}

/** Applique les effets d'adaptation à une séance (copie). */
function applyFx(s,w,A){
  const fx=fxForDate(sessDate(w,s.day)); if(!fx) return s;
  const o={...s};
  if(fx.legStop && ['long','ef','inter','tempo','test','course','velo','muscu-bas','escalade'].includes(s.type)){
    return {...o,type:'repos',cat:'Repos',title:'Repos jambes imposé',dur:null,dist:null,
      adapted:`Indice ${fx.idx}/100`,struct:null,wu:null,main:null,cd:null,ex:null,
      note:'Indice de charge du tendon au-delà de 80 : aucune charge sur les jambes aujourd’hui. Mobilité de cheville, glaçage 15 minutes deux fois dans la journée, jambes surélevées le soir. Si tu es encore ici dans trois jours, prends rendez-vous chez ton kiné.'};
  }
  if(fx.lightLegs && s.type==='muscu-bas'){
    return {...o,title:'Bas du corps — version allégée',dur:[25,30],
      adapted:`Indice ${fx.idx}/100`,
      ex:[['Stanish unilatéral','3 x 10','charge divisée par deux, 4 s à la descente'],
          ['Pointes de pied genou fléchi','3 x 12','sans charge'],
          ['Pont fessier unilatéral','3 x 12',''],
          ['Mobilité cheville + voûte plantaire','8 min',''],
          ['Gainage','3 x 40 s','']],
      note:'Le protocole excentrique reste, à charge réduite : c’est lui qui répare le tendon, l’arrêter complètement serait contre-productif. On enlève tout ce qui est lourd et pliométrique.'};
  }
  if(fx.runStop && ['long','ef','inter','tempo','test','course','race'].includes(s.type) && s.type!=='race'){
    return {...o,type:'velo',cat:'Vélo',title:'Vélo Z2 50 min remplace la course',dur:[50,60],
      adapted:`Indice ${fx.idx}/100 · course en pause`,struct:null,wu:null,main:null,cd:null,
      note:'La course est en pause : l’indice de charge du tendon est dans le rouge. Vélo souple sans résistance, cadence élevée. Le tendon redevient disponible dès que l’indice repasse sous 65.'};
  }
  if(s.type==='long' && fx.slCut && s.dist){
    const nd=Math.round(s.dist*(1-fx.slCut));
    return {...o,dist:nd,title:`Sortie longue de ${nkm(nd)} km`,
      adapted:`Réduite de ${Math.round(fx.slCut*100)} % · indice ${fx.idx}/100`,
      struct:[{km:nd,zone:'ef'}],
      note:'Version réduite : le tendon a parlé. 100 % allure conversationnelle, protocole course/marche autorisé.'};
  }
  if(['inter','tempo','test'].includes(s.type) && (fx.cancelQuality||fx.qualityToBike)){
    return {...o,type:'velo',cat:'Vélo',
      title:fx.cancelQuality?'Vélo Z2 60 min remplace la qualité':'Vélo Z3 50 min remplace la qualité',
      dur:fx.cancelQuality?[60,70]:[50,60],adapted:`Qualité neutralisée · indice ${fx.idx}/100`,
      dist:null,struct:null,wu:null,main:null,cd:null,
      note:fx.cancelQuality
        ? 'Aucune intensité cette semaine. Vélo en endurance pure, cadence 90 rpm.'
        : 'Intensité conservée mais sans impact : 5 x 6 min en Z3 sur le vélo, 3 min de récupération souple entre les blocs.'};
  }
  if(s.type==='ef' && s.day===1 && fx.tuesdayToBike){
    return {...o,type:'velo',cat:'Vélo',title:'Vélo Z2 45 min remplace l’EF',dur:[45,55],
      adapted:`Course neutralisée · indice ${fx.idx}/100`,dist:null,struct:null,
      note:'Le lendemain de la sortie longue est le pire moment pour un tendon irrité. Vélo souple à la place.'};
  }
  return o;
}
function weekSessions(w,A){
  return w.sessions.map(s=>applyFx({...s},w,A));
}

function morningCard(now){

function alertBox(A){

/* ---------- onglet Programme ---------- */
function vPlan(A){
  const w=weekOf(S.week), sess=weekSessions(w,A);
  const b=PLAN.blocs.find(x=>x.id===w.bloc);
  const now=iso(TODAY);
  const curW=PLAN.weeks.find(x=>now>=x.monday && now<=addD(x.monday,6));
  let h=`<div class="topbar"><h1>Programme</h1>
    <div class="sub">Marathon de Paris · dimanche 11 avril 2027</div></div>`;
  h+=`<div class="wknav">
    <button onclick="setWeek(${S.week-1})"${S.week<=1?' disabled style="opacity:.25"':''}>${I('x').replace('M6 6l12 12M18 6 6 18','M14.5 5 8 12l6.5 7')}</button>
    <div class="lbl"><b>Semaine ${w.n}</b><span>${fmtD(w.monday)} — ${fmtD(addD(w.monday,6))}</span></div>
    <button onclick="setWeek(${S.week+1})"${S.week>=35?' disabled style="opacity:.25"':''}>${I('x').replace('M6 6l12 12M18 6 6 18','M9.5 5 16 12l-6.5 7')}</button></div>`;
  h+=`<div class="card tight" style="border-color:${b.color}44;background:linear-gradient(135deg,${b.color}14,var(--surface))">
    <span class="blocpill" style="background:${b.color}22;color:${b.color}">Bloc ${b.id} · ${esc(b.name)}</span>
    <div style="font-size:14.5px;line-height:1.5;color:#D6D9DE">${esc(b.focus)}</div>
    <div style="display:flex;gap:20px;margin-top:13px">
      <div><b style="font-size:19px;font-weight:800">${nkm(w.sl)} km</b>
        <div style="font-size:12px;color:var(--ink-2);font-weight:600">sortie longue</div></div>
      <div><b style="font-size:19px;font-weight:800">${sess.filter(s=>['long','ef','inter','tempo','test','course','race'].includes(s.type)).length}</b>
        <div style="font-size:12px;color:var(--ink-2);font-weight:600">course${sess.filter(s=>['long','ef','inter','tempo','test','course','race'].includes(s.type)).length>1?'s':''}</div></div>
      <div><b style="font-size:19px;font-weight:800">${w.deload?'Oui':'Non'}</b>
        <div style="font-size:12px;color:var(--ink-2);font-weight:600">décharge</div></div></div></div>`;
  for(let d=0;d<7;d++){
    const ds=sess.map((s,i)=>[s,i]).filter(([s])=>s.day===d);
    if(!ds.length) continue;
    const isToday = sessDate(w,d)===now;
    h+=`<div class="daylbl">${DAYS[d]} ${fmtD(sessDate(w,d))}${isToday?' <span class="badge ok" style="margin-left:6px">aujourd\'hui</span>':''}</div>`;
    h+=ds.map(([s,i])=>sessCard(w,s,i)).join('');
  }
  if(curW && curW.n!==S.week)
    h+=`<button class="btn primary" style="margin-top:16px" onclick="setWeek(${curW.n})">Aller à la semaine en cours</button>`;
  return h;
}
function setWeek(n){ S.week=clamp(n,1,35); render(); }

/* ---------- onglet Suivi ---------- */
function vTrack(A){
  // série douleur : carnet Notion + retours de l'app
  const byDate={};
  NOTION.forEach(r=>{ byDate[r.date]={date:r.date,wake:r.painWake,eff:r.painEffort,eve:r.painEvening,
    km:r.km,min:r.min,rpe:r.rpe,acts:r.activities,src:'notion',icing:r.icing,jumps:r.jumps,
    hydration:r.hydration,note:r.note}; });
  Object.entries(S.morning).forEach(([d,v])=>{ byDate[d]=byDate[d]||{date:d,acts:[],km:0,min:0,src:'app'};
    byDate[d].wake=v; });
  Object.values(S.fb).forEach(f=>{ if(!f.date) return;
    byDate[f.date]=byDate[f.date]||{date:f.date,acts:[],km:0,min:0,src:'app'};
    const b=byDate[f.date];
    b.eff=Math.max(b.eff??0,f.pain); b.rpe=Math.max(b.rpe??0,f.rpe);
    b.km=(b.km||0)+(f.km||0); b.acts=[...(b.acts||[]),f.cat];
  });
  const rows=Object.values(byDate).sort((a,b)=>a.date<b.date?-1:1);
  // fenêtres calendaires, ancrées sur le jour le plus récent enregistré
  const ref = rows.length ? rows[rows.length-1].date : iso(TODAY);
  const win=(from,to)=>rows.filter(r=>r.date>addD(ref,-to) && r.date<=addD(ref,-from));
  const last7=win(0,7), prev7=win(7,14), last28=win(0,28);
  const avg=(a,k)=>{const v=a.map(x=>x[k]).filter(x=>x!=null); return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
  const sref=STRAVA.length?STRAVA[STRAVA.length-1].date:iso(TODAY);
  const km7=STRAVA.filter(a=>a.sport==='Run'&&a.date>addD(sref,-7)).reduce((s,a)=>s+a.km,0)
    +Object.values(S.fb).filter(f=>f.km&&f.date>addD(sref,-7)).reduce((s,f)=>s+f.km,0);
  const km28=STRAVA.filter(a=>a.sport==='Run'&&a.date>addD(sref,-28)).reduce((s,a)=>s+a.km,0);
  const done=Object.keys(S.fb).length;

  let h=`<div class="topbar"><h1>Suivi</h1>
    <div class="sub">Carnet tendon d'Achille · ${rows.length} jours enregistrés</div></div>`;

  const w7=avg(last7,'wake');
  h+=`<div class="kpis">
    <div class="kpi"><div class="l">Douleur réveil · 7 j</div>
      <div class="v" style="color:${painCol(w7??0)}">${w7==null?'—':nkm(Math.round(w7*10)/10)}<small> /10</small></div>
      <div class="d" style="color:var(--ink-2)">${trend(avg(last7,'wake'),avg(prev7,'wake'))}</div></div>
    <div class="kpi"><div class="l">Volume course · 7 j</div><div class="v">${nkm(km7)}<small> km</small></div>
      <div class="d" style="color:var(--ink-2)">${nkm(Math.round(km28))} km sur 28 j</div></div>
    <div class="kpi"><div class="l">Douleur fin de journée</div>
      <div class="v" style="color:${painCol(avg(last7,'eve')??0)}">${avg(last7,'eve')==null?'—':nkm(Math.round(avg(last7,'eve')*10)/10)}<small> /10</small></div>
      <div class="d" style="color:var(--ink-2)">le signal le plus fiable</div></div>
    <div class="kpi"><div class="l">Séances notées</div><div class="v">${done}<small> / ${PLAN.weeks.reduce((a,w)=>a+w.sessions.filter(s=>s.feedback).length,0)}</small></div>
      <div class="d" style="color:var(--ink-2)">depuis le 10 août</div></div></div>`;

  // chart 0 — indice de charge du tendon
  const IX=indexSeries(), nowd=iso(TODAY);
  const ixRows=IX.rows.filter(r=>r.d>=addD(nowd,-56)&&r.d<=addD(nowd,10))
    .map(r=>({d:r.d,v:r.idx,fut:r.d>nowd}));
  h+=`<div class="viz"><h4>Indice de charge du tendon</h4>
    <p class="cap">Zéro veut dire tendon frais, cent veut dire repos obligatoire. Les points après aujourd'hui sont une projection : ce que donnerait l'indice si tu fais les séances prévues et que ta douleur reste à son niveau actuel.</p>
    <div style="position:relative"><div data-chart="idx" data-rows='${esc(JSON.stringify(ixRows))}'></div>
    <div class="tip" id="tip-idx"></div></div>
    <div class="legend">${BANDS.map(b=>`<i><b style="background:${b.c}"></b>${b.n}</i>`).join('')}</div>
    <button class="disc" onclick="toggleTable('idx')">${S.tableView.idx?'Masquer':'Afficher'} le détail du calcul</button>
    ${S.tableView.idx?idxTable(IX,nowd):''}</div>`;

  // chart 1 — douleur multi-séries
  h+=`<div class="viz"><h4>Douleur au fil des jours</h4>
    <p class="cap">Trois moments de mesure. La courbe qui compte le plus est celle de fin de journée : sur une tendinopathie, la réaction est retardée de plusieurs heures.</p>
    <div style="position:relative"><div data-chart="pain" data-rows='${esc(JSON.stringify(rows.map(r=>({d:r.date,a:r.wake,b:r.eff,c:r.eve}))))}'></div>
    <div class="tip" id="tip-pain"></div></div>
    <div class="legend"><i><b style="background:var(--series-1)"></b>Réveil</i>
      <i><b style="background:var(--series-2)"></b>Pendant l'effort</i>
      <i><b style="background:var(--series-3)"></b>Fin de journée</i></div>
    <button class="disc" onclick="toggleTable('pain')">${S.tableView.pain?'Masquer':'Afficher'} le tableau des valeurs</button>
    ${S.tableView.pain?painTable(rows):''}</div>`;

  // chart 2 — volume hebdo réel (Strava)
  const wk={};
  STRAVA.filter(a=>a.sport==='Run').forEach(a=>{ const d=parse(a.date); const off=(d.getDay()+6)%7;
    const mon=iso(new Date(d.getTime()-off*864e5));
    wk[mon]=(wk[mon]||0)+a.km; });
  Object.values(S.fb).forEach(f=>{ if(!f.date||!f.km) return;
    const d=parse(f.date), off=(d.getDay()+6)%7;
    const mon=iso(new Date(d.getTime()-off*864e5)); wk[mon]=(wk[mon]||0)+f.km; });
  const wkArr=Object.entries(wk).sort().map(([d,v])=>({d,v:Math.round(v*10)/10}));
  const planWk=PLAN.weeks.map(w=>({d:w.monday,v:Math.round((w.sl+w.efKm+(w.sessions.find(s=>['inter','tempo','test','course'].includes(s.type))||{dist:0}).dist)*10)/10}));
  h+=`<div class="viz"><h4>Volume de course par semaine</h4>
    <p class="cap">Tes kilomètres réels depuis mai, relevés sur Strava. Le vélo, la musculation et les randonnées n'y figurent pas : seul l'impact au sol charge le tendon. Tu tournes entre 26 et 56 km ; le plan te mène vers 55 à 60 en bloc spécifique.</p>
    <div style="position:relative"><div data-chart="vol" data-rows='${esc(JSON.stringify(wkArr))}'></div>
    <div class="tip" id="tip-vol"></div></div></div>`;

  // chart 3 — charge d'entraînement toutes disciplines
  const eff={};
  STRAVA.forEach(a=>{ const d=parse(a.date), off=(d.getDay()+6)%7;
    const mon=iso(new Date(d.getTime()-off*864e5));
    eff[mon]=eff[mon]||{run:0,other:0};
    if(a.sport==='Run') eff[mon].run+=a.eff; else eff[mon].other+=a.eff; });
  const effArr=Object.entries(eff).sort().map(([d,v])=>({d,a:v.run,b:v.other}));
  h+=`<div class="viz"><h4>Charge d'entraînement par semaine</h4>
    <p class="cap">L'effort relatif Strava, séparé entre la course et le reste (vélo, musculation, randonnée, foot). La part non-course est ce qui te permet de garder du volume aérobie pendant que le tendon récupère.</p>
    <div style="position:relative"><div data-chart="load" data-rows='${esc(JSON.stringify(effArr))}'></div>
    <div class="tip" id="tip-load"></div></div>
    <div class="legend"><i><b style="background:var(--series-1)"></b>Course</i>
      <i><b style="background:var(--series-3)"></b>Vélo, muscu, autres</i></div></div>`;

  // chart 3 — sortie longue planifiée
  h+=`<div class="viz"><h4>Progression prévue de la sortie longue</h4>
    <p class="cap">Jamais plus de 2 km d'écart d'une semaine à l'autre, ta règle, y compris pour remonter après une décharge. La semaine 1 est à zéro : c'est l'amorce. Le pic à 32 km est atteint quatre fois, la dernière longue de 28 km tombe trois semaines avant la course.</p>
    <div style="position:relative"><div data-chart="sl" data-rows='${esc(JSON.stringify(PLAN.weeks.map(w=>({n:w.n,v:w.sl,dl:w.deload}))))}'></div>
    <div class="tip" id="tip-sl"></div></div>
    <div class="legend"><i><b style="background:var(--series-1)"></b>En progression</i>
      <i><b style="background:#1c5cab"></b>Semaine de décharge</i>
      <i><b style="background:#86b6ef"></b>Semaine en cours</i></div></div>`;

  // protocole
  const ic=rows.filter(r=>r.icing).length, jp=rows.filter(r=>r.jumps).length;
  h+=`<div class="viz"><h4>Protocole tendon</h4>
    <p class="cap">Sur les ${rows.length} jours enregistrés. Le glaçage n'accélère pas la guérison mais calme la réaction du soir ; les sauts sont le test de charge de ton kiné.</p>
    ${meter('Glaçage',ic,rows.length,'var(--series-1)')}
    ${meter('Sauts / pliométrie',jp,rows.length,'var(--series-3)')}
    ${meter('Hydratation ≥ 1,5 L',rows.filter(r=>(r.hydration??0)>=1.5).length,rows.length,'var(--series-2)')}</div>`;

  // lecture
  h+=`<div class="alert info"><h4>${I('chart')} Ce que croisent tes deux sources</h4>
    <p>Le carnet dit : douleur au réveil 0,8/10 en moyenne, pendant l'effort 0,6/10, en fin de journée 1,3/10 avec un pic à 5. <b>Tu ne sens presque rien en courant, la douleur arrive le soir.</b> C'est pourquoi le curseur de fin de journée pèse autant que celui de la séance dans les adaptations. Les deux pics à 5 et 3 suivent tous les deux une séance de vélo en Z3, pas une course : la flexion plantaire soutenue sur le home trainer mérite plus d'attention que ton volume de course.</p>
    <p style="margin-top:10px">Strava dit : 563 km courus depuis le 1er mai, entre 26 et 56 km par semaine, sans jamais de vraie coupure. Ton 25 km du 9 août à 5:38/km avec 140 de FC moyenne est le meilleur signal du lot — c'est de l'endurance fondamentale franche sur 2 h 20, et ça veut dire que ton moteur aérobie n'est pas le facteur limitant. Ce qui limite, c'est le tendon.</p></div>`;
  return h;
}
function painCol(v){ return v<=1?'var(--good)':v<=3?'var(--warning)':v<=5?'var(--serious)':'var(--critical)'; }
function trend(a,b){ if(a==null||b==null) return 'pas assez de recul';
  const d=a-b; if(Math.abs(d)<.2) return 'stable';
  return d<0?`en baisse de ${nkm(Math.abs(Math.round(d*10)/10))}`:`en hausse de ${nkm(Math.round(d*10)/10)}`; }
function meter(l,v,t,c){ const p=t?Math.round(v/t*100):0;
  return `<div class="meter"><div class="top"><span>${l}</span><b>${v} / ${t} · ${p} %</b></div>
    <div class="track"><div class="fill" style="width:${p}%;background:${c}"></div></div></div>`; }
function painTable(rows){
  return `<div style="max-height:290px;overflow-y:auto;margin-top:10px"><table>
    <thead><tr><th>Jour</th><th>Réveil</th><th>Effort</th><th>Soir</th><th>km</th></tr></thead><tbody>
    ${rows.slice().reverse().map(r=>`<tr><td>${fmtD(r.date)}</td><td>${r.wake??'—'}</td>
      <td>${r.eff??'—'}</td><td>${r.eve??'—'}</td><td>${r.km?nkm(r.km):'—'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function toggleTable(k){ S.tableView[k]=!S.tableView[k]; render(); }

    <div class="seg">${[['2:59:30','Sub-3'],['3:15:00','3 h 15'],['3:25:00','3 h 25']]
      .map(([v,l])=>{const s=Math.round((+v.split(':')[0]*3600+ +v.split(':')[1]*60+ +v.split(':')[2])/42.195);
        return `<button aria-pressed="${Math.abs(s-goal)<2}" onclick="setGoal(${s})">${l}</button>`;}).join('')}</div></div>`;

  h+=`<div class="alert info"><h4>${I('gauge')} D'où viennent ces chiffres</h4>
    <p>Ton 3 km en 12:02 correspond à un VDOT d'environ 55 dans les tables de Jack Daniels. Les six zones en découlent : seuil à l'allure marathon moins 20 s/km, intervalles moins 40, endurance facile plus 50. Un détail compte : sur ce test, ta FC moyenne était de 174 et ton maximum de 179, alors que ta zone 5 commence à 184. Tu n'as pas vidé le réservoir, donc ta valeur réelle est meilleure que 12:02 et ces allures sont légèrement conservatrices. Avec un tendon qui sort de blessure, c'est la bonne erreur à faire.</p></div>`;
  return h;
}
function zDesc(k){ return {recup:'Lendemain de sortie longue, footing de décrassage',
  ef:'Le socle du plan, allure conversationnelle stricte',
  am:'L\'allure du 11 avril, à ancrer dans le corps',
  seuil:'Effort soutenu tenable 40 à 60 minutes',
  vo2:'Fractionné 800 m à 1 200 m, effort 9/10',
  rep:'400 m à 600 m, vivacité et économie de course'}[k]||''; }
function calib(){
  const v=$('#t3k').value.trim();
  const m=v.match(/^(\d{1,2})[:.'](\d{1,2})$/);
  if(!m){ toast('Format attendu : mm:ss, par exemple 12:02'); return; }
  const sec=+m[1]*60+ +m[2];
  if(sec<480||sec>1500){ toast('Temps hors plage plausible (8:00 à 25:00)'); return; }
  S.fitPace=Math.round(sec/3+48); S.test3k=v; S.calibrated=true;
  const t=S.fitPace*42.195;
  toast(`Forme projetée : ${dur(Math.round(t/60))} (${pace(S.fitPace)}/km)`);
  render();
}
function setGoal(s){
  S.refPace=s;
  toast(`Objectif ${dur(Math.round(s*42.195/60))} · allure marathon ${pace(s)}/km`);
  render();
}

    ${[['Z1 Récupération','moins de 123','moins de 68 %'],
       ['Z2 Endurance fondamentale','123 à 150','68 à 83 %'],
       ['Z3 Tempo','150 à 161','83 à 89 %'],
       ['Z4 Seuil','161 à 170','89 à 94 %'],
       ['Z5 VO2 max','plus de 170','plus de 94 %']]
      .map(([n,bpm,pc])=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14.5px">

    <textarea id="exp" readonly style="min-height:130px;font-size:12.5px;font-family:ui-monospace,monospace">${esc(exportTxt())}</textarea>

  h+=`<div class="card"><b style="font-size:16px;display:block;margin-bottom:9px">Structure des 35 semaines</b>

      <div style="font-size:13.5px;color:var(--ink-2);font-weight:600;margin-bottom:4px">Semaines ${b.weeks[0]} à ${b.weeks[1]} · ${fmtD(ws[0].monday)} → ${fmtD(addD(ws[ws.length-1].monday,6))} · sortie longue ${nkm(Math.min(...ws.map(w=>w.sl)))} à ${nkm(Math.max(...ws.map(w=>w.sl)))} km</div>
      <div style="font-size:14.5px;line-height:1.45">${esc(b.focus)}</div></div>`;}).join('')}</div>`;

function exportTxt(){
  return JSON.stringify({v:2,refPace:S.refPace,test3k:S.test3k,
    morning:S.morning,evening:S.evening,fb:S.fb},null,1);
}
function cp(){ const t=$('#exp'); t.select(); try{document.execCommand('copy');toast('Copié');}catch(e){toast('Sélectionne et copie à la main');} }
function impo(){ const t=$('#exp'); t.readOnly=false; t.value=''; t.placeholder='Colle ton export ici puis appuie sur Entrée';
  t.focus();
  t.onkeydown=e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey||true)){ e.preventDefault();
    try{ const o=JSON.parse(t.value); S.refPace=o.refPace||S.refPace; S.test3k=o.test3k||null;
      S.calibrated=!!o.test3k; S.morning=o.morning||{}; S.evening=o.evening||{};
      S.fb=o.fb||{}; _IDX=null; toast('Historique restauré'); render(); }
    catch(err){ toast('JSON invalide'); } } };
}

/* ============================================================ détail séance */
let SHEET=null;
function openSheet(wn,day,idx){
  const w=weekOf(wn), A=adapt(), sess=weekSessions(w,A);
  const s=sess[idx] && sess[idx].day===day ? sess[idx] : sess.find(x=>x.day===day);
  SHEET={wn,day,idx,s};
  const k=fbKey(wn,day,idx), f=S.fb[k];
  const isRun=['long','ef','inter','tempo','test','course','race'].includes(s.type);
  const gg=g(s.type);
  let h=`<button class="close" onclick="closeSheet()">${I('x')}</button>`;
  h+=`<div class="badge" style="background:${gc(s.type)}26;color:#fff;margin-bottom:10px">
    <span class="dot" style="--g:${gg};margin:0"></span>${esc(s.cat)} · ${fmtDL(sessDate(w,day))}</div>`;
  h+=`<h2>${esc(s.title)}</h2>`;
  if(s.adapted) h+=`<div style="margin:10px 0 0"><span class="badge warn">${I('alert')} ${esc(s.adapted)}</span></div>`;
  h+=`<div class="kv">
    ${s.dist?`<div><span>Distance</span><b>${nkm(s.dist)} km</b></div>`:''}
    ${s.type!=='repos'?`<div><span>Durée</span><b>${durTxt(s)}</b></div>`:''}
    ${!s.dist&&s.type==='repos'?`<div><span>Charge</span><b>Aucune</b></div>`:''}</div>`;
  h+=`<div class="hr"></div>`;

  if(isRun||s.ex){
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:14px">
      <div style="font-size:22px;font-weight:800;letter-spacing:-.6px">Détails</div>
      ${isRun&&!['race','course'].includes(s.type)?`<div class="seg" style="max-width:206px;flex:1">
        <button aria-pressed="${S.surface==='out'}" onclick="setSurf('out')">Extérieur</button>
        <button aria-pressed="${S.surface==='mill'}" onclick="setSurf('mill')">Tapis</button></div>`:''}</div>`;
  }

  if(s.struct){
    h+=`<div class="secth">${I('run')} Session</div>`;
    h+=s.struct.map(x=>step(`${nkm(x.km)} km`,x.zone)).join('');
  }
  if(s.wu||s.main||s.cd){
    if(s.wu&&s.wu.length){ h+=`<div class="secth">${I('up')} Échauffement</div>`+segs(s.wu); }
    if(s.main&&s.main.length){ h+=`<div class="secth">${I('run')} ${['race','course'].includes(s.type)?'Course':'Corps de séance'}</div>`+segs(s.main); }
    if(s.cd&&s.cd.length){ h+=`<div class="secth">${I('down')} Retour au calme</div>`+segs(s.cd); }
  }
  if(s.ex){
    h+=`<div class="secth">${I('dumb')} Exercices</div><div style="margin-top:-4px">`;
    h+=s.ex.map(([n,r,d])=>`<div class="ex"><div class="n">${esc(n)}${d?`<em>${esc(d)}</em>`:''}</div>
      <div class="s">${esc(r)}</div></div>`).join('')+`</div>`;
  }
  if(s.type==='escalade'||s.type==='repos'){
    h+=`<div class="secth">${I(TYPE_ICON[s.type])} ${s.type==='repos'?'Consignes':'Séance'}</div>`;
    h+=step(s.type==='repos'?'Aucune charge sur les jambes':'Escalade en salle',null,
      s.type==='repos'?'Mobilité cheville, étirements doux, glaçage si sensible'
                      :'Voies en tête et en moulinette, effort libre');
  }
  if(S.surface==='mill'&&isRun) h+=`<div class="alert info" style="margin-top:18px">
    <h4>${I('run')} Sur tapis</h4><p>Règle l'inclinaison à 1 % pour compenser l'absence de résistance de l'air. Le tapis réduit la charge excentrique sur le tendon à l'attaque du pied : c'est une bonne option les jours où la douleur au réveil dépasse 2.</p></div>`;

  h+=`<div class="dash"></div>
    <div class="coach"><div class="av">C</div><div><b>Coach Claude</b><span>Ton plan, tes contraintes</span></div></div>
    <div class="cnote">${esc(s.note)}</div>`;

  // ressenti
  h+=`<div class="dash"></div><div class="secth">${I('heart')} Ton ressenti</div>`;
  if(f){
    h+=`<div class="alert l0"><h4>${I('check')} Séance notée le ${fmtD(f.date)}</h4>
      <p>Douleur au tendon ${nkm(f.pain)}/10 · effort perçu ${f.rpe}/10${f.note?`<br><span style="color:var(--ink-2)">« ${esc(f.note)} »</span>`:''}</p></div>
      <button class="btn dim" onclick="editFb()">Modifier</button>`;
  }else{
    h+=fbForm(f);
  }
  h+=`<div style="height:20px"></div>`;
  $('#sheetBody').innerHTML=h;
  $('#sheet').style.setProperty('--g',gg);
  $('#sheet').classList.add('open');
  document.body.style.overflow='hidden';
  bindSliders();
}
function segs(list){
  return list.map(([a,b])=>{
    const lbl = typeof a==='number' ? `${nkm(a)} km` : String(a);
    if(b===null||b===undefined) return step(lbl,null);
    if(PLAN.zones[b]) return step(lbl,b);
    return step(lbl,null,String(b));
  }).join('');
}
function step(main,zone,sub){
  const z=zone&&PLAN.zones[zone];
  const col=z?g(z.color):null;
  const label=z?`${main} : ${pace(zPace(zone))}/km`:main;
  const s=z?(zone==='am'?'Ton allure cible marathon':zone==='ef'||zone==='recup'
      ?`Pas plus vite que ${pace(zPace(zone))}/km. C'est une limite, pas un objectif.`
      :zLabel(zone)):sub;
  return `<div class="step" style="--sg:${col||'var(--ink-3)'}">
    <b>${esc(label)}</b>${s?`<span>${esc(s)}</span>`:''}</div>`;
}
function setSurf(v){ S.surface=v; openSheet(SHEET.wn,SHEET.day,SHEET.idx); }
function closeSheet(){ $('#sheet').classList.remove('open'); document.body.style.overflow='';
  SHEET=null; render(); }

function fbForm(f){
  return `<p style="color:var(--ink-2);font-size:14.5px;line-height:1.5;margin:0 0 4px">
    Deux curseurs après chaque séance. C'est ce qui pilote l'adaptation du plan : au-delà de 4 sur la douleur, la semaine suivante change automatiquement.</p>
    ${slider('pain',f?f.pain:0,'pain','Douleur au tendon d’Achille')}
    ${slider('rpe',f?f.rpe:5,'rpe','Effort perçu')}
    <textarea id="fbnote" placeholder="Note libre : sensations, terrain, ce qui a coincé…" style="margin-top:14px">${f?esc(f.note||''):''}</textarea>
    <button class="btn primary" style="margin-top:12px" onclick="saveFb()">Enregistrer mon ressenti</button>`;
}
function editFb(){ const k=fbKey(SHEET.wn,SHEET.day,SHEET.idx); delete S.fb[k]; _IDX=null;
  openSheet(SHEET.wn,SHEET.day,SHEET.idx); }

const PAIN_H=['Rien du tout. Le tendon ne se manifeste pas.',
 'Une présence, pas une douleur. Tout va bien.',
 'Sensible mais silencieux à l’effort. Zone de travail acceptable.',
 'Gêne nette. On surveille, on ne change rien encore.',
 'Douleur. Le plan s’adapte : plateau de la sortie longue, qualité en vélo.',
 'Douleur franche. Plateau et qualité neutralisée.',
 'Trop. Sortie longue réduite de 25 %, qualité annulée.',
 'Trop. Recul net sur la semaine à venir.',
 'Stop. Cinq jours sans course, vélo et haut du corps seulement.',
 'Stop et kiné. On ne discute pas.',
 'Stop et kiné. On ne discute pas.'];
const RPE_H=['','Très facile, tu pourrais recommencer tout de suite.',
 'Facile. Conversation possible sans effort.','Confortable. Le socle de l’endurance.',
 'Modéré. Tu sens le travail sans le subir.','Soutenu. Phrases courtes.',
 'Difficile. Quelques mots seulement.','Dur. Allure de seuil.',
 'Très dur. Tu comptes les répétitions.','Presque maximal. Séance réussie de justesse.',
 'Maximal. Tu n’aurais pas pu faire plus.'];
function slider(id,val,kind,label){
  const max=10, v=val??0;
  const track = kind==='pain'
    ? `linear-gradient(90deg,#0ca30c 0%,#8fc41a 25%,#fab219 45%,#ec835a 68%,#d03b3b 100%)`
    : `linear-gradient(90deg,#3987e5 0%,#199e70 35%,#fab219 70%,#d03b3b 100%)`;
  return `<div class="sl" data-sl="${id}" data-kind="${kind}">
    ${label?`<div class="top"><b>${esc(label)}</b><span class="val" id="v-${id}">${v}<span style="font-size:15px;color:var(--ink-2)">/10</span></span></div>`:''}
    <input type="range" min="0" max="${max}" step="1" value="${v}" id="r-${id}" style="--track:${track}">
    <div class="ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span></div>
    <div class="hint" id="h-${id}">${kind==='pain'?PAIN_H[v]:RPE_H[v]||''}</div></div>`;
}
function bindSliders(){
  document.querySelectorAll('[data-sl]').forEach(el=>{
    const id=el.dataset.sl, kind=el.dataset.kind;
    const r=el.querySelector('input'); if(!r||r._b) return; r._b=1;
    const up=()=>{ const v=+r.value;
      const vv=document.getElementById('v-'+id); if(vv) vv.innerHTML=v+'<span style="font-size:15px;color:var(--ink-2)">/10</span>';
      const hh=document.getElementById('h-'+id); if(hh) hh.textContent=kind==='pain'?PAIN_H[v]:(RPE_H[v]||'');
    };
    r.addEventListener('input',up);
  });
}
function saveFb(){
  const p=+document.getElementById('r-pain').value, r=+document.getElementById('r-rpe').value;
  const n=(document.getElementById('fbnote')||{}).value||'';
  const w=weekOf(SHEET.wn), s=SHEET.s;
  const kind=['inter','tempo','test','course','race'].includes(s.type)?'q':
             s.type==='long'?'l':s.type.startsWith('muscu')?'m':'o';
  S.fb[fbKey(SHEET.wn,SHEET.day,SHEET.idx)]={pain:p,rpe:r,note:n.trim(),
    date:sessDate(w,SHEET.day),kind,cat:s.cat,km:s.dist||0,type:s.type};
  _IDX=null;
  const A=adapt();
  toast(`Indice de charge du tendon : ${A.idx}/100 · ${A.band.n.toLowerCase()}`);
  openSheet(SHEET.wn,SHEET.day,SHEET.idx);
}
function saveMorning(){
  const now=iso(TODAY);
  const m=document.getElementById('r-morn'), e=document.getElementById('r-eve');
  if(m) S.morning[now]=+m.value;
  if(e) S.evening[now]=+e.value;
  _IDX=null;
  const A=adapt();
  toast(`Indice de charge du tendon : ${A.idx}/100 · ${A.band.n.toLowerCase()}`);
  render();
}

/* ============================================================ charts */
function drawChart(el){
  const kind=el.dataset.chart, rows=JSON.parse(el.dataset.rows);
  const W=el.clientWidth||320;
  if(kind==='idx') el.innerHTML=idxChart(rows,W);
  if(kind==='pain') el.innerHTML=lineChart(rows,W,el);
  if(kind==='vol') el.innerHTML=barChart(rows.map(r=>({l:fmtD(r.d),v:r.v,k:r.d})),W,'km',el,'vol');
  if(kind==='sl') el.innerHTML=barChart(rows.map(r=>({l:'S'+r.n,v:r.v,dl:r.dl,n:r.n})),W,'km',el,'sl');
  if(kind==='load') el.innerHTML=stackChart(rows.map(r=>({l:fmtD(r.d),a:r.a,b:r.b,d:r.d})),W);
  hookTip(el,kind,rows);
}
function lineChart(rows,W){
  const H=182, P={t:8,r:6,b:22,l:26};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const n=rows.length; if(!n) return '';
  const x=i=>P.l+(n===1?iw/2:i*iw/(n-1));
  const y=v=>P.t+ih-(clamp(v,0,10)/10)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Douleur au fil des jours">`;
  for(let v=0;v<=10;v+=2){ s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${P.l-7}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`; }
  // seuil d'adaptation à 4
  s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(4)}" y2="${y(4)}" stroke="var(--warning)" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/>`;
  s+=`<text x="${W-P.r}" y="${y(4)-6}" text-anchor="end" fill="var(--warning)" opacity=".9">seuil 4</text>`;
  const series=[['a','var(--series-1)'],['b','var(--series-2)'],['c','var(--series-3)']];
  series.forEach(([k,c])=>{
    const pts=rows.map((r,i)=>[i,r[k]]).filter(([,v])=>v!=null);
    if(!pts.length) return;
    let d='',prev=null;
    pts.forEach(([i,v])=>{ d += (prev!==null&&i===prev+1?'L':(d?' M':'M'))+`${x(i)} ${y(v)} `; prev=i; });
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach(([i,v])=>{ s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${c}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  const stepX=Math.max(1,Math.ceil(n/5));
  rows.forEach((r,i)=>{ if(i%stepX===0||i===n-1) s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${fmtD(r.d)}</text>`; });
  s+=`<line class="ch" x1="0" x2="0" y1="${P.t}" y2="${P.t+ih}" stroke="var(--border-2)" stroke-width="1" opacity="0"/>`;
  s+=`<rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"
    data-x0="${P.l}" data-iw="${iw}" data-n="${n}"/></svg>`;
  return s;
}
function barChart(rows,W,unit,el,kind){
  const H=176, P={t:8,r:6,b:22,l:26};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, n=rows.length;
  if(!n) return '';
  const max=Math.max(...rows.map(r=>r.v),1)*1.1;
  const slot=iw/n;
  const bw=clamp(slot-Math.min(4,slot*.32),2.5,34);   // marks fins, plafonnés
  const x=i=>P.l+i*slot+(slot-bw)/2;
  const y=v=>P.t+ih-(v/max)*ih;
  const now=iso(TODAY);
  const curW=PLAN.weeks.find(w=>now>=w.monday&&now<=addD(w.monday,6));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  const ticks=4;
  for(let t=0;t<=ticks;t++){ const v=max/ticks*t;
    s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${P.l-7}" y="${y(v)+3.5}" text-anchor="end">${Math.round(v)}</text>`; }
  rows.forEach((r,i)=>{
    const h=Math.max(2,ih-(y(r.v)-P.t));
    let c='var(--series-1)';
    if(kind==='sl'){ c = r.dl?'#1c5cab':'var(--series-1)';
      if(curW&&r.n===curW.n) c='#86b6ef'; }
    s+=`<rect x="${x(i)}" y="${y(r.v)}" width="${bw}" height="${h}" rx="${Math.min(4,bw/2)}" fill="${c}"
      data-i="${i}"/>`;
  });
  const stepX=Math.max(1,Math.ceil(n/6));
  rows.forEach((r,i)=>{ if(i%stepX===0||i===n-1)
    s+=`<text x="${x(i)+bw/2}" y="${H-6}" text-anchor="middle">${esc(r.l)}</text>`; });
  s+=`<rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"
    data-x0="${P.l}" data-iw="${iw}" data-n="${n}"/></svg>`;
  return s;
}
function idxChart(rows,W){
  const H=190, P={t:8,r:6,b:22,l:26};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, n=rows.length;
  if(!n) return '';
  const x=i=>P.l+(n===1?iw/2:i*iw/(n-1));
  const y=v=>P.t+ih-(clamp(v,0,100)/100)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Indice de charge du tendon">`;
  // bandes de fond
  let prev=0;
  BANDS.forEach(b=>{ s+=`<rect x="${P.l}" y="${y(b.max)}" width="${iw}" height="${Math.max(0,y(prev)-y(b.max))}"
     fill="${b.c}" opacity=".075"/>`; prev=b.max; });
  [0,25,50,75,100].forEach(v=>{ s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
    <text x="${P.l-7}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`; });
  const iToday=rows.findIndex(r=>r.fut);
  const cut=iToday<0?n-1:iToday-1;
  const seg=(from,to,dash)=>{
    if(to<from) return '';
    let d='';
    for(let i=from;i<=to;i++) d+=(i===from?'M':'L')+`${x(i)} ${y(rows[i].v)} `;
    return `<path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"${dash?' stroke-dasharray="4 4" opacity=".6"':''}/>`;
  };
  s+=seg(0,cut,false)+seg(Math.max(0,cut),n-1,true);
  rows.forEach((r,i)=>{ if(r.fut) return;
    s+=`<circle cx="${x(i)}" cy="${y(r.v)}" r="2.6" fill="${bandOf(r.v).c}" stroke="var(--surface)" stroke-width="1.6"/>`; });
  if(cut>=0) s+=`<circle cx="${x(cut)}" cy="${y(rows[cut].v)}" r="5" fill="${bandOf(rows[cut].v).c}" stroke="var(--surface)" stroke-width="2.5"/>`;
  const st=Math.max(1,Math.ceil(n/5));
  rows.forEach((r,i)=>{ if(i%st===0||i===n-1) s+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${fmtD(r.d)}</text>`; });
  s+=`<line class="ch" x1="0" x2="0" y1="${P.t}" y2="${P.t+ih}" stroke="var(--border-2)" stroke-width="1" opacity="0"/>`;
  s+=`<rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"
    data-x0="${P.l}" data-iw="${iw}" data-n="${n}"/></svg>`;
  return s;
}
function idxTable(IX,now){
  const rows=IX.rows.filter(r=>r.d<=now).slice(-14).reverse();
  return `<div style="max-height:300px;overflow-y:auto;margin-top:10px"><table>
    <thead><tr><th>Jour</th><th>Charge</th><th>Douleur</th><th>Méca</th><th>Crédits</th><th>Indice</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${fmtD(r.d)}</td><td>${nkm(r.load)}</td><td>${r.p}</td>
      <td>${r.m1+r.m2+r.mo}</td><td style="color:var(--good)">−${r.cr}</td>
      <td style="font-weight:800;color:${bandOf(r.idx).c}">${r.idx}</td></tr>`).join('')}
    </tbody></table>
    <p style="color:var(--ink-3);font-size:12.5px;line-height:1.5;margin:12px 2px 0">
    Charge en kilomètres-équivalents tendon : un kilomètre en endurance vaut 1, en sortie longue 1,15, au seuil 1,6, en intervalles 2,1. Une minute de vélo vaut 0,10 et une minute de renfo bas du corps 0,25.</p></div>`;
}
function stackChart(rows,W){
  const H=176, P={t:8,r:6,b:22,l:28};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, n=rows.length;
  if(!n) return '';
  const max=Math.max(...rows.map(r=>r.a+r.b),1)*1.1;
  const slot=iw/n, bw=clamp(slot-Math.min(4,slot*.32),2.5,34);
  const x=i=>P.l+i*slot+(slot-bw)/2;
  const y=v=>P.t+ih-(v/max)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let k=0;k<=4;k++){ const v=max/4*k;
    s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${P.l-7}" y="${y(v)+3.5}" text-anchor="end">${Math.round(v)}</text>`; }
  rows.forEach((r,i)=>{
    const hb=Math.max(0,ih-(y(r.b)-P.t));
    const ha=Math.max(0,ih-(y(r.a)-P.t));
    // segment bas (autres), puis course au-dessus, avec 2 px de surface entre les deux
    if(r.b>0) s+=`<rect x="${x(i)}" y="${y(r.b)}" width="${bw}" height="${hb}" rx="2" fill="var(--series-3)"/>`;
    if(r.a>0) s+=`<rect x="${x(i)}" y="${y(r.a+r.b)}" width="${bw}" height="${Math.max(1,ha-2)}" rx="2" fill="var(--series-1)"/>`;
  });
  const st=Math.max(1,Math.ceil(n/6));
  rows.forEach((r,i)=>{ if(i%st===0||i===n-1)
    s+=`<text x="${x(i)+bw/2}" y="${H-6}" text-anchor="middle">${esc(r.l)}</text>`; });
  s+=`<rect x="${P.l}" y="${P.t}" width="${iw}" height="${ih}" fill="transparent" class="hit"
    data-x0="${P.l}" data-iw="${iw}" data-n="${n}"/></svg>`;
  return s;
}
function hookTip(el,kind,rows){
  const svg=el.querySelector('svg'), hit=el.querySelector('.hit');
  const tip=document.getElementById('tip-'+kind);
  if(!svg||!hit||!tip) return;
  const ch=svg.querySelector('.ch');
  const move=e=>{
    const b=svg.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-b.left;
    const b2=b.width/svg.viewBox.baseVal.width;
    const n=+hit.dataset.n, x0=+hit.dataset.x0*b2, iw=+hit.dataset.iw*b2;
    let i=(kind==='pain'||kind==='idx') ? Math.round((cx-x0)/(iw/(n-1||1)))
                        : Math.floor((cx-x0)/(iw/n));
    i=clamp(i,0,n-1);
    const r=rows[i];
    let html='';
    if(kind==='idx'){
      const full=indexSeries().byDate[r.d]||{};
      const b=bandOf(r.v);
      html=`<div class="t">${fmtDL(r.d)}${r.fut?' · projection':''}</div>
        <div class="r"><i style="background:${b.c}"></i>${b.n}<b>${r.v}</b></div>
        <div class="r" style="color:var(--ink-3)">Douleur<b style="color:var(--ink-2)">${full.p??0}</b></div>
        <div class="r" style="color:var(--ink-3)">Charge<b style="color:var(--ink-2)">${(full.m1??0)+(full.m2??0)+(full.mo??0)}</b></div>
        <div class="r" style="color:var(--ink-3)">Crédits<b style="color:var(--ink-2)">−${full.cr??0}</b></div>`;
      if(ch){ const px=x0+(iw/(n-1||1))*i; ch.setAttribute('x1',px/(b2)); ch.setAttribute('x2',px/(b2)); ch.setAttribute('opacity','1'); }
    }else if(kind==='pain'){
      html=`<div class="t">${fmtDL(r.d)}</div>`+
        [['Réveil',r.a,'var(--series-1)'],['Effort',r.b,'var(--series-2)'],['Fin de journée',r.c,'var(--series-3)']]
        .filter(([,v])=>v!=null)
        .map(([l,v,c])=>`<div class="r"><i style="background:${c}"></i>${l}<b>${nkm(v)}</b></div>`).join('')
        || '<div class="r">aucune donnée</div>';
      if(ch){ const px=x0+(iw/(n-1||1))*i; ch.setAttribute('x1',px/b2);
        ch.setAttribute('x2',px/b2); ch.setAttribute('opacity','1'); }
    }else if(kind==='vol'){
      html=`<div class="t">Semaine du ${fmtD(r.d)}</div><div class="r"><i style="background:var(--series-1)"></i>Course<b>${nkm(r.v)} km</b></div>`;
    }else if(kind==='load'){
      html=`<div class="t">Semaine du ${fmtD(r.d)}</div>
        <div class="r"><i style="background:var(--series-1)"></i>Course<b>${r.a}</b></div>
        <div class="r"><i style="background:var(--series-3)"></i>Autres<b>${r.b}</b></div>
        <div class="r" style="color:var(--ink-3)">Total<b style="color:var(--ink-2)">${r.a+r.b}</b></div>`;
    }else{
      const w=weekOf(r.n);
      html=`<div class="t">Semaine ${r.n} · ${fmtD(w.monday)}</div>
        <div class="r"><i style="background:var(--series-1)"></i>Sortie longue<b>${nkm(r.v)} km</b></div>
        <div class="r" style="color:var(--ink-3)">${r.dl?'semaine de décharge':w.blocName}</div>`;
    }
    tip.innerHTML=html; tip.classList.add('on');
    const tw=tip.offsetWidth||140;
    tip.style.left=clamp(cx-tw/2,2,b.width-tw-2)+'px';
    tip.style.top='4px';
  };
  const out=()=>{ tip.classList.remove('on'); if(ch) ch.setAttribute('opacity','0'); };
  hit.addEventListener('mousemove',move); hit.addEventListener('mouseleave',out);
  hit.addEventListener('touchstart',move,{passive:true});
  hit.addEventListener('touchmove',move,{passive:true});
  hit.addEventListener('touchend',out);
}

/* ============================================================ boot */
(function(){
  const now=iso(TODAY);
  const cur=PLAN.weeks.find(w=>now>=w.monday&&now<=addD(w.monday,6));
  S.week=cur?cur.n:1;
  render();
  window.addEventListener('resize',()=>{ document.querySelectorAll('[data-chart]').forEach(drawChart); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&SHEET) closeSheet(); });
})();
</script>
